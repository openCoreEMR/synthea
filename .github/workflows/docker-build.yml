name: Build Docker Image

on:
  push:
    branches:
    - '*'
  pull_request:
    branches:
    - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Extract and validate branch name
      id: prep
      shell: bash
      run: |
        if [[ "${{ github.event_name }}" = pull_request ]]; then
          echo "should_push=false" >> $GITHUB_OUTPUT
          echo "image_tag=local" >> $GITHUB_OUTPUT
          echo "Skipping push for pull request"
        else
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [[ "$BRANCH_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
            repo="${{ github.repository }}"
            echo "image_tag=ghcr.io/${repo,,}:$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "Valid branch name: $BRANCH_NAME"
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
            echo "image_tag=local" >> $GITHUB_OUTPUT
            echo "Skipping push for branch with special characters: $BRANCH_NAME"
          fi
        fi

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: steps.prep.outputs.should_push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: ${{ steps.prep.outputs.should_push == 'true' && 'Build and push Docker image' || 'Build Docker image' }}
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ steps.prep.outputs.should_push == 'true' }}
        tags: ${{ steps.prep.outputs.image_tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
